<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chatbot Nutricional</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Raleway', sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    .chat-bubble {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background-color: #4CAF50;
      color: white;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
      z-index: 999;
    }

    .chat-bubble:hover {
      transform: scale(1.1);
    }

    .chat-container {
      position: fixed;
      bottom: 100px;
      right: 30px;
      width: 350px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      overflow: hidden;
      display: none;
      flex-direction: column;
      z-index: 999;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-header {
      background-color: #4CAF50;
      color: white;
      padding: 10px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
    }

    .chat-box {
      padding: 15px;
      height: 300px;
      overflow-y: auto;
      background: #f9f9f9;
    }

    .msg {
      margin-bottom: 10px;
    }

    .user {
      text-align: right;
      background-color: #d1e7dd;
      padding: 10px;
      border-radius: 10px;
      display: inline-block;
      max-width: 80%;
    }

    .bot {
      text-align: left;
      background-color: #e7f1ff;
      padding: 10px;
      border-radius: 10px;
      display: inline-block;
      max-width: 80%;
    }

    form {
      display: flex;
      gap: 5px;
      padding: 10px;
      border-top: 1px solid #ddd;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px 15px;
      background-color: #4CAF50;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .footer {
      margin-top: 10px;
      font-size: 0.85em;
      color: #777;
      text-align: center;
    }

    select {
      padding: 8px;
      margin: 10px auto;
      display: block;
      border-radius: 5px;
    }

    form[method="post"] > label {
      display: block;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<!-- Botón flotante -->
<div class="chat-bubble" id="chat-bubble">🤖</div>

<!-- Contenedor del chat -->
<div class="chat-container" id="chat-container">
  <div class="chat-header">
    Chatbot Nutricional
    <span class="close-btn" id="close-btn">❌</span>
  </div>

  <!-- Inicio del contenido dinámico con Jinja -->
  {% if step == "select" %}
    <form method="post">
      <label for="idioma">Selecciona un idioma:</label>
      <select name="idioma" required>
        <option value="">-- Elige un idioma --</option>
        <option value="español">Español</option>
        <option value="inglés">Inglés</option>
        <option value="francés">Francés</option>
        <option value="alemán">Alemán</option>
        <option value="portugués">Portugués</option>
        <option value="italiano">Italiano</option>
      </select>
      <button type="submit">Comenzar</button>
    </form>

  {% elif step == "chat" %}
    <div class="chat-box" id="chat">
      {% for autor, texto in messages %}
        <div class="msg">
          {% if autor == "Tú" %}
            <div class="user">{{ texto }}</div>
          {% else %}
            <div class="bot"><strong>🤖 {{ autor }}:</strong> {{ texto|safe }}</div>
          {% endif %}
        </div>
      {% endfor %}
    </div>

    <form method="post">
      <input type="text" name="mensaje" placeholder="Escribe tu mensaje..." required>
      <button type="submit">Enviar</button>
    </form>

    <div class="footer">
      Escribe "7" o "Salir" para cerrar la sesión.
    </div>
  {% endif %}
  <!-- Fin del contenido dinámico con Jinja -->

</div>

<!-- Scripts -->
<script>
  const chatBubble = document.getElementById('chat-bubble');
  const chatContainer = document.getElementById('chat-container');
  const closeBtn = document.getElementById('close-btn');

  // Mostrar u ocultar el chat al hacer click en el botón
  chatBubble.addEventListener('click', () => {
    const isVisible = chatContainer.style.display === 'block';
    chatContainer.style.display = isVisible ? 'none' : 'block';
    localStorage.setItem('chatVisible', !isVisible);
  });

  // Botón de cerrar dentro del chat
  closeBtn.addEventListener('click', () => {
    chatContainer.style.display = 'none';
    localStorage.setItem('chatVisible', 'false');
  });

  // Mantener el estado al recargar
  window.addEventListener('load', () => {
    if (localStorage.getItem('chatVisible') === 'true') {
      chatContainer.style.display = 'block';
    }
  });

  // Auto-scroll
  window.addEventListener('load', () => {
    const chatBox = document.getElementById('chat');
    if (chatBox) {
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  });
</script>

</body>
</html>
